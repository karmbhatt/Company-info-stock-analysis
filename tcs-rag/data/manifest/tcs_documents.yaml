# Single source of truth for which TCS documents go into the RAG corpus.
# - Add a document by adding an entry; the fetch script does the rest.
# - Leave `url` empty until you have verified the link on tcs.com / ar.tcs.com.
# - `id` becomes the filename, so keep it lowercase with underscores.
company: TCS

documents:
  # ---- Annual reports -------------------------------------------------------
  - id: tcs_annual_report_fy2026
    document_type: annual_report
    fiscal_year: FY2026
    title: TCS Integrated Annual Report 2025-26
    url: ""   # TODO: copy the "Download Report" link from https://www.ar.tcs.com/
    source_page: "https://www.ar.tcs.com/"

  - id: tcs_annual_report_fy2025
    document_type: annual_report
    fiscal_year: FY2025
    title: TCS Annual Report 2024-25
    url: ""   # TODO: copy from https://www.tcs.com/investor-relations/financial-statements

  # ---- Quarterly results ----------------------------------------------------
  - id: tcs_results_q4_fy26
    document_type: quarterly_results
    fiscal_year: FY2026
    period: Q4 FY26
    title: TCS Financial Results, quarter ended March 31, 2026
    url: "https://www.tcs.com/content/dam/tcs/pdf/discover-tcs/investor-relations/corporate-actions/2025-26/financial-results-qr-mar-31-2026.pdf"

  - id: tcs_results_q1_fy26
    document_type: quarterly_results
    fiscal_year: FY2026
    period: Q1 FY26
    title: TCS Financial Results, quarter ended June 30, 2025
    url: "https://www.tcs.com/content/dam/tcs/pdf/discover-tcs/investor-relations/corporate-actions/2025-26/financial-results-qe-jun-30-2025.pdf"

  - id: tcs_earnings_call_q1_fy27
    document_type: earnings_call
    fiscal_year: FY2027
    period: Q1 FY27
    title: TCS Q1 FY27 Earnings Conference Call transcript (July 9, 2026)
    url: "https://www.tcs.com/content/dam/tcs/investor-relations/financial-statements/2026-27/q1/Management%20Commentary/Transcript%20of%20the%20Q1%202026-27%20Earnings%20Conference%20Call%20held%20on%20Jul%209,%202026.pdf"

  - id: tcs_press_release_q1_fy27_inr
    document_type: quarterly_results
    fiscal_year: FY2027
    period: Q1 FY27
    title: TCS Q1 FY27 results press release (INR)
    url: "https://www.tcs.com/content/dam/tcs/investor-relations/financial-statements/2026-27/q1/IND%20AS/Press%20Release%20-%20INR.pdf"
