[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "company-info-stock-analysis"
version = "0.1.0"
description = "Data engineering platform for TCS stock and company analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
    "yfinance>=1.7,<2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
]

[tool.setuptools.packages.find]
where = ["src"]